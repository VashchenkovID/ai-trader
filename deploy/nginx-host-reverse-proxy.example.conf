# Хостовый nginx: HTTPS на 443, прокси на Docker-фронт (127.0.0.1:8080 = FRONTEND_PORT по умолчанию).
#
# Установка:
#   sudo cp deploy/nginx-host-reverse-proxy.example.conf /etc/nginx/sites-available/vashchenkovaitrader.ru
#   sudo ln -sf /etc/nginx/sites-available/vashchenkovaitrader.ru /etc/nginx/sites-enabled/
#
# Сертификаты Let's Encrypt (пути должны существовать до включения блока 443):
#   sudo certbot certonly --webroot -w /var/www/html -d vashchenkovaitrader.ru -d www.vashchenkovaitrader.ru
#   или: certbot --nginx -d ...
#
# После появления /etc/letsencrypt/options-ssl-nginx.conf можно заменить блок «SSL» ниже на:
#   include /etc/letsencrypt/options-ssl-nginx.conf;
#   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;  # если файл есть

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vashchenkovaitrader.ru www.vashchenkovaitrader.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vashchenkovaitrader.ru www.vashchenkovaitrader.ru;

    ssl_certificate     /etc/letsencrypt/live/vashchenkovaitrader.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vashchenkovaitrader.ru/privkey.pem;

    # Без зависимости от certbot-файла options-ssl-nginx.conf (его может не быть до первого запуска certbot)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
