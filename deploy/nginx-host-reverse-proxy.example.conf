# Хостовый nginx: HTTPS на 443, прокси на Docker-фронт (docker compose: FRONTEND_PORT:80 → по умолчанию 8080).
#
# Установка (Debian/Ubuntu):
#   sudo cp deploy/nginx-host-reverse-proxy.example.conf /etc/nginx/sites-available/vashchenkovaitrader.ru
#   sudo ln -sf /etc/nginx/sites-available/vashchenkovaitrader.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификаты: certbot certonly --nginx -d vashchenkovaitrader.ru -d www.vashchenkovaitrader.ru
# Если нет ssl-dhparams.pem — закомментируйте строку ssl_dhparam ниже.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vashchenkovaitrader.ru www.vashchenkovaitrader.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vashchenkovaitrader.ru www.vashchenkovaitrader.ru;

    ssl_certificate     /etc/letsencrypt/live/vashchenkovaitrader.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vashchenkovaitrader.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # Раскомментируйте после: certbot ... && certbot создаст файл при необходимости
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
