# Пример для хоста: TLS на 443, трафик в Docker-фронт на 127.0.0.1:8080
# Скопируйте в /etc/nginx/sites-available/ и подключите sites-enabled;
# FRONTEND_PORT в docker-compose должен быть 8080 (или поменяйте порт ниже).

server {
    listen 80;
    listen [::]:80;
    server_name vashchenkovaitrader.ru www.vashchenkovaitrader.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vashchenkovaitrader.ru www.vashchenkovaitrader.ru;

    ssl_certificate     /etc/letsencrypt/live/vashchenkovaitrader.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vashchenkovaitrader.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
