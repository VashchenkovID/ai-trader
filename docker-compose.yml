services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-trader-postgres
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${POSTGRES_DB:-ai_trader}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_trader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fastapi:
    build:
      context: ./server_fastapi
      dockerfile: Dockerfile
    container_name: ai-trader-fastapi
    env_file:
      - ./server_fastapi/.env
    environment:
      TZ: Europe/Moscow
      APP_NAME: ai-trader-fastapi
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_TIMEZONE: Europe/Moscow
      ERROR_REGISTRY_PATH: /app/logs/error_registry.json
      RUNTIME_ERROR_LOG_PATH: /app/logs/runtime_errors.jsonl
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_trader}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      USER_PASSWORD: ${USER_PASSWORD}
      TINKOFF_TOKEN: ${TINKOFF_TOKEN}
      TINKOFF_ACCOUNT_ID: ${TINKOFF_ACCOUNT_ID}
      TINKOFF_API_URL: ${TINKOFF_API_URL:-https://invest-public-api.tinkoff.ru/rest}
      TINKOFF_VERIFY_SSL: ${TINKOFF_VERIFY_SSL:-true}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      FRONTEND_URL: ${FRONTEND_URL:-https://vashchenkovaitrader.ru,https://www.vashchenkovaitrader.ru,http://vashchenkovaitrader.ru,http://www.vashchenkovaitrader.ru}
      NEWS_API_KEY: ${NEWS_API_KEY}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      VIRTUAL_CAPITAL: ${VIRTUAL_CAPITAL:-1000000}
      MAX_POSITION_SIZE: ${MAX_POSITION_SIZE:-0.02}
      MAX_DRAWDOWN: ${MAX_DRAWDOWN:-0.15}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.6}
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID}
      GIGACHAT_CLIENT_SECRET: ${GIGACHAT_CLIENT_SECRET}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE}
      YANDEX_API_KEY: ${YANDEX_API_KEY}
      YANDEX_IAM_TOKEN: ${YANDEX_IAM_TOKEN}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      CUTOVER_BACKUP_ROLLUP_PATH: /app/data/cutover_backups/cutover_backups.jsonl
      CUTOVER_BACKUP_KEEP_RAW: ${CUTOVER_BACKUP_KEEP_RAW:-5}
      LIGHTNING_LOGS_DIR: /app/lightning_logs
      LIGHTNING_ROLLUP_PATH: /app/logs/lightning_runs.jsonl
      LIGHTNING_KEEP_RAW: ${LIGHTNING_KEEP_RAW:-3}
    volumes:
      - ./server_fastapi/logs:/app/logs
      - ./server_fastapi/models:/app/models
      - ./server_fastapi/data:/app/data
      - ./server_fastapi/lightning_logs:/app/lightning_logs
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "mkdir -p /app/logs /app/models /app/data /app/mlruns /app/lightning_logs &&
      chmod -R 777 /app/logs /app/models /app/data /app/mlruns /app/lightning_logs &&
      alembic -c alembic.ini upgrade head &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: ai-trader-client
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_PORT_HTTPS:-443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - fastapi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

