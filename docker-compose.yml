# Переменные ${...} — из `.env` в КОРНЕ репозитория (рядом с docker-compose.yml), не из server_fastapi/.env.
#
# PostgreSQL в Docker: POSTGRES_PASSWORD / POSTGRES_DB применяются только при ПЕРВОМ создании тома postgres_data.
# Если уже был `docker compose up`, пароль и набор БД «запечены». Смена строк в .env не меняет кластер:
#   либо `docker compose down -v` (удалит данные!) и заново с нужными POSTGRES_*,
#   либо вручную: CREATE DATABASE aitrader; ALTER USER postgres PASSWORD '...';
#
# FastAPI: DATABASE_URL собирается из тех же POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB, что и контейнер postgres
# (иначе после первого init кластер с одним паролем, а приложение подключается с другим → password authentication failed).
#
# VITE_API_BASE_URL — пусто для прод-сборки (запросы на /api того же домена).
#
# Домен в браузере: хостовый nginx → 127.0.0.1:${FRONTEND_PORT:-8080} (см. deploy/nginx-host-reverse-proxy.example.conf).

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-trader-postgres
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${POSTGRES_DB:-ai_trader}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # БД postgres всегда есть; имя из POSTGRES_DB могло ещё не быть создано при старом томе
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fastapi:
    build:
      context: ./server_fastapi
      dockerfile: Dockerfile
    container_name: ai-trader-fastapi
    # Все имена из server_fastapi/.env.example попадают в контейнер отсюда (без дублирования в environment:),
    # иначе compose подставляет ${VAR} из .env у корня репозитория и перезаписывает значения из этого файла.
    env_file:
      - ./server_fastapi/.env
    environment:
      TZ: Europe/Moscow
      # Тот же пароль/БД, что у сервиса postgres выше (корневой .env). В пароле избегайте символов @ : / ? # &.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_trader}
      # Явные пути под смонтированные тома (см. volumes ниже)
      ERROR_REGISTRY_PATH: /app/logs/error_registry.json
      RUNTIME_ERROR_LOG_PATH: /app/logs/runtime_errors.jsonl
      CUTOVER_BACKUP_DIR: /app/data/cutover_backups
      CUTOVER_BACKUP_ROLLUP_PATH: /app/data/cutover_backups/cutover_backups.jsonl
      LIGHTNING_LOGS_DIR: /app/lightning_logs
      LIGHTNING_ROLLUP_PATH: /app/logs/lightning_runs.jsonl
    volumes:
      - ./server_fastapi/logs:/app/logs
      - ./server_fastapi/models:/app/models
      - ./server_fastapi/data:/app/data
      - ./server_fastapi/lightning_logs:/app/lightning_logs
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "mkdir -p /app/logs /app/models /app/data /app/mlruns /app/lightning_logs &&
      chmod -R 777 /app/logs /app/models /app/data /app/mlruns /app/lightning_logs &&
      alembic -c alembic.ini upgrade head &&
      python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Пусто → в бандле API = origin сайта (nginx /api → fastapi). localhost здесь сломает прод в браузере.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: ai-trader-client
    # Фронт в контейнере только HTTP:80; TLS на хостовом nginx (deploy/). Иначе FRONTEND_PORT=80 и освободить порт на хосте.
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - fastapi
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
