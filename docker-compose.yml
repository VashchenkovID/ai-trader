# version устарел в новых версиях Docker Compose, но оставляем для совместимости
# version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: ai-trader-db
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_exchange}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-trader-network
    restart: unless-stopped

  # Backend сервер
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-trader-server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_exchange}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://vashchenkovaitrader.ru,https://www.vashchenkovaitrader.ru,http://vashchenkovaitrader.ru,http://www.vashchenkovaitrader.ru}
      TINKOFF_TOKEN: ${TINKOFF_TOKEN}
      TINKOFF_ACCOUNT_ID: ${TINKOFF_ACCOUNT_ID}
      TINKOFF_API_URL: ${TINKOFF_API_URL:-https://invest-public-api.tinkoff.ru/rest}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      NEWS_API_KEY: ${NEWS_API_KEY}
      VIRTUAL_CAPITAL: ${VIRTUAL_CAPITAL:-1000000}
      MAX_POSITION_SIZE: ${MAX_POSITION_SIZE:-0.02}
      MAX_DRAWDOWN: ${MAX_DRAWDOWN:-0.15}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.6}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-false}
      USER_PASSWORD: ${USER_PASSWORD}
    volumes:
      - ./server/logs:/app/logs
      - ./server/backups:/app/backups
      - ./server/models:/app/models
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-trader-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend клиент
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai-trader-client
    ports:
      - "${CLIENT_PORT:-80}:80"
      - "${CLIENT_PORT_HTTPS:-443}:443"
    volumes:
      # Монтируем SSL сертификаты (обязательно для HTTPS!)
      # Для Let's Encrypt (раскомментируйте после получения сертификата):
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Или для собственных сертификатов (закомментируйте Let's Encrypt и раскомментируйте):
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    networks:
      - ai-trader-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  ai-trader-network:
    driver: bridge

